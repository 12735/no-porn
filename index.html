<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Browser Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f4f4f9;
    }

    /* Browser Bar */
    .browser-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background-color: #202124;
      color: white;
    }

    .address-bar {
      flex: 1;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #555;
      background-color: #303134;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .address-bar:focus {
      border-color: #8ab4f8;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background-color: #1a73e8;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #1557b0;
    }

    /* Web View Area */
    .content-area {
      flex: 1;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Blocked Screen Overlay */
    .blocked-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff0f0;
      color: #900;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .blocked-screen h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .blocked-screen p {
      font-size: 16px;
      color: #555;
    }
  </style>
</head>
<body>

  <!-- Browser Controls -->
  <div class="browser-header">
    <input 
      type="text" 
      id="urlInput" 
      class="address-bar" 
      placeholder="Type a website URL or search term..."
    >
    <button class="btn" onclick="navigate()">Go</button>
  </div>

  <!-- Content View -->
  <div class="content-area">
    <iframe id="webFrame" src="about:blank"></iframe>

    <!-- Blocked Notice -->
    <div id="blockedScreen" class="blocked-screen">
      <h1>⚠️ Access Blocked</h1>
      <p>This request contains explicit content and was blocked by your safe browser policy.</p>
    </div>
  </div>

  <script>
    // 1. Adult keyword blocklist
    const BLOCKED_KEYWORDS = [
      "porn", "nsfw", "xxx", "adult", "erotic", "sex", "hentai", "strip"
    ];

    // Check if input contains blocked keywords
    function containsExplicitContent(input) {
      const lowerInput = input.toLowerCase();
      return BLOCKED_KEYWORDS.some(keyword => lowerInput.includes(keyword));
    }

    // Main navigation logic
    function navigate() {
      const input = document.getElementById("urlInput").value.trim();
      const iframe = document.getElementById("webFrame");
      const blockedScreen = document.getElementById("blockedScreen");

      if (!input) return;

      // Reset view
      blockedScreen.style.display = "none";
      iframe.style.display = "block";

      // 2. Intercept and block explicit terms
      if (containsExplicitContent(input)) {
        iframe.style.display = "none";
        blockedScreen.style.display = "flex";
        return;
      }

      // 3. Process safe input
      let targetUrl = input;

      if (input.startsWith("http://") || input.startsWith("https://")) {
        targetUrl = input;
      } else if (input.includes(".") && !input.includes(" ")) {
        targetUrl = "https://" + input;
      } else {
        // Enforce SafeSearch on Google query
        targetUrl = "https://www.bing.com/search?q=" + encodeURIComponent(input) + "&adlt=strict";
      }

      iframe.src = targetUrl;
    }

    // Trigger navigation on 'Enter' key press
    document.getElementById("urlInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        navigate();
      }
    });
  </script>

</body>
</html>
